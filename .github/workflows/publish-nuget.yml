name: Publish NuGet to GitHub Packages

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'           # déclenche aussi sur git tag v1.2.3
  workflow_dispatch:   # déclenchement manuel depuis l'onglet Actions

env:
  PACKAGE_VERSION: 120.6099.211-avalonia12

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # nécessaire pour pousser sur GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore CefGlue.Avalonia/CefGlue.Avalonia.csproj

      - name: Pack
        run: |
          dotnet pack CefGlue.Avalonia/CefGlue.Avalonia.csproj \
            -c Release \
            /p:Version="${{ env.PACKAGE_VERSION }}" \
            --no-restore \
            --output ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
